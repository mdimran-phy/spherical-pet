# spherical-pet GAGG baseline defaults; CLI overrides this file.
# Assumptions and sources: ../docs/ray_baseline.md

# simulation (0) or geometry (1); geometry performs overlap checks
mode = simulation

# Number of primary events
events = 10

# New output directory; existing paths are never overwritten
output = results/run

# Positive random seed, at most 2147483646
seed = 20261029

# Primary: gamma, e-, or e+
particle = gamma

# Primary kinetic energy [keV], including for positrons
energy-kev = 511

# Polar direction from +z [degrees, 0..180]
theta = 0

# Azimuth from +x toward +y [degrees]
phi = 0

# fixed or isotropic directions
angular = fixed

# Source x position [mm]
source-x-mm = 0

# Source y position [mm]
source-y-mm = 0

# Source z position [mm]
source-z-mm = 0

# Scintillator shell thickness [mm]; outer radius remains 34.5 mm
shell-thickness-mm = 10

# pentagon-hexagon (supplied) or pentagon-octagon (beveled variant)
guide-shape = pentagon-hexagon

# Octagon corner cut as fraction of adjacent hexagon edges (0 < f < 0.5)
guide-bevel-fraction = 0.25

# Sensor center pitch in each 4x4 array [mm]
sipm-pitch-mm = 4.4

# Built-in G4SiPM model name; package must fit array pitch
sipm-model = HamamatsuS1036233100

# Scintillator material: GAGG (baseline) or LYSO
scintillator = GAGG

# Provisional GAGG scintillation photons per keV
gagg-yield = 57

# Provisional single-component GAGG decay [ns]
gagg-decay-ns = 88

# Constant GAGG refractive index
gagg-index = 1.9

# Assumed GAGG absorption length [mm], unmeasured
gagg-absorption-mm = 1000

# Scintillation photons per keV
lyso-yield = 32

# Scintillation decay time [ns]
lyso-decay-ns = 41

# Constant LYSO refractive index
lyso-index = 1.81

# Constant LYSO optical absorption length [mm]
lyso-absorption-mm = 413

# Flat spectrum center [eV]; auto: GAGG 520 nm, LYSO 2.8 eV
scint-energy-ev = auto

# Full width of provisional flat spectrum [eV]
scint-width-ev = 0.02

# Optional CSV: energy_eV,intensity; overrides flat spectrum
spectrum = 

# Reference sensor-window and outer-mask epoxy index (not guide/coupling)
epoxy-index = 1.5

# Reference window/mask absorption [mm]; 0 disables bulk absorption
epoxy-absorption-mm = 0

# Provisional guide resin refractive index
guide-index = 1.5

# Assumed guide absorption [mm]; 0 disables
guide-absorption-mm = 1000

# Provisional Encapso-surrogate refractive index
coupling-index = 1.43

# Assumed coupling absorption [mm]; 0 disables
coupling-absorption-mm = 1000

# Radial coupling layer [mm], taken from guide volume (0 < t <= 0.5)
coupling-thickness-mm = 0.05

# Ground inner boundary: bare, reflector, or absorber
inner-surface = bare

# Assumed ground-surface microfacet roughness [rad]
inner-sigma-alpha-rad = 0.1

# Reflector-mode inner reflectivity [0..1]
inner-reflectivity = 0.98

# Exposed guide/mask boundary: bare, reflector, or absorber
guide-boundary = absorber

# Reflector-mode guide reflectivity [0..1]
guide-reflectivity = 0.98

# Enable upstream SiPM photon-detection-efficiency filter [0/1]
pde-filter = 1

# Enable SiPM cell-geometry filter [0/1]
cell-filter = 1

# Electromagnetic production range cut [mm]
range-cut-mm = 0.1

# Per-track guard; killed tracks are reported and cause exit code 1
max-steps = 10000

# Save full steps for first N optical tracks/event (0 disables)
track-photons = 0

# Export geometry OBJ, inventory and sensor centers [0/1]
export-geometry = 1

# Angular tessellation steps for display only [12..192]
mesh-steps = 96

# Check placed volumes before simulation [0/1]
check-overlaps = 0

# Sampled points per volume for overlap check
overlap-samples = 1000

# Overlap-check tolerance [mm]
overlap-tolerance-mm = 0.001

# Optional source macro; /gps/* commands only
macro = 

# 1 batch; 0 opens native geometry, tracks and SiPM hits (UIVIS build)
batch = 1

# First N optical paths/event in native display; 0 hides optical paths
vis-photons = 50

# Application and SiPM verbosity [0..2]
verbose = 0

